# CI репозитория HackChange: линтеры, тесты с покрытием, проверка спецификаций, алертов и сборка образов.
# Итог покрытия - в Summary запуска.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ai-it-buddy/core, ai-it-buddy/loggen, llm-gateway, incident-radar]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/buddy_test?sslmode=disable
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      - name: test
        # -p 1: интеграционные тесты core используют одну базу
        run: go test -race -p 1 -count=1 -coverprofile=coverage.out ./...
      - name: coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          printf '| модуль | покрытие |\n|---|---|\n| %s | %s |\n' "${{ matrix.module }}" "$total" >> "$GITHUB_STEP_SUMMARY"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-it-buddy/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-it-buddy/agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: test
        # модель не вызывается: в тестах фейковая LLM, бесплатный лимит не тратится
        run: python -m pytest -q --cov=buddy_agent --cov-report=term --cov-report=xml
      - name: coverage
        run: |
          total=$(python -c "import xml.etree.ElementTree as e; print(f\"{float(e.parse('coverage.xml').getroot().get('line-rate'))*100:.1f}%\")")
          printf '| модуль | покрытие |\n|---|---|\n| ai-it-buddy/agent | %s |\n' "$total" >> "$GITHUB_STEP_SUMMARY"

  specs-and-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: OpenSpec
        working-directory: ai-it-buddy
        run: OPENSPEC_TELEMETRY=0 npx --yes @fission-ai/openspec@2 validate --all --strict
      - name: Prometheus config and alert tests
        working-directory: ai-it-buddy/deploy/prometheus
        run: |
          docker run --rm -v "$PWD:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.1 check config prometheus.yml
          docker run --rm -v "$PWD:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.1 test rules alerts_test.yml
      - name: OpenAPI
        run: npx --yes @redocly/cli@2 lint --skip-rule=operation-4xx-response --skip-rule=info-license ai-it-buddy/core/internal/httpapi/openapi.yaml

  images:
    runs-on: ubuntu-latest
    needs: [go, agent]
    steps:
      - uses: actions/checkout@v5
      - name: compose config
        working-directory: ai-it-buddy
        run: docker compose config -q
      - name: build
        working-directory: ai-it-buddy
        run: docker compose build

