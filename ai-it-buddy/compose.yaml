# AI IT-Buddy: ядро (Go), Postgres, агент (Python, LangGraph), LLM-шлюз, incident-radar, Prometheus и Grafana.
# Порты открыты только на 127.0.0.1 и сдвинуты (8080, 4001, 9091, 3001), чтобы не пересекаться с другими проектами.
# Агент наружу не публикуется: к нему ходит только ядро.
# Провайдер LLM выбирается в .env: LLM_CONFIG=llm-gateway.yaml (OpenRouter, по умолчанию) или llm-gateway.deepseek.yaml
name: ai-it-buddy

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  core:
    <<: *hardening
    build: ./core
    image: ai-it-buddy-core:dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data:ro
    environment:
      CORE_ADDR: ":8080"
      DATA_DIR: /data
      AGENT_URL: http://agent:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      DEMO_TOKEN: ${DEMO_TOKEN:-demo}
      APPROVAL_DELAY: ${APPROVAL_DELAY:-15s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-buddy-dev-password}@postgres:5432/buddy?sslmode=disable
      RADAR_URL: http://incident-radar:8765/mcp
      RADAR_TOKEN: ${RADAR_TOKEN:-dev-radar-token}
      RADAR_SERVICES: vpn,gitlab
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

  # Заявки, доступы, уведомления, база знаний (полнотекстовый поиск). Наружу не публикуется:
  # посмотреть руками - docker compose exec postgres psql -U buddy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_DB: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "buddy", "-d", "buddy"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 256m

  agent:
    <<: *hardening
    build: ./agent
    image: ai-it-buddy-agent:dev
    tmpfs: [/tmp]
    environment:
      LLM_BASE_URL: http://llm-gateway:4000/v1
      CORE_MCP_URL: http://core:8080/mcp
      HOME: /tmp   # gunicorn пишет служебный сокет в домашний каталог, а файловая система только на чтение
    mem_limit: 512m
    depends_on:
      llm-gateway:
        condition: service_started

  # Интерфейс: статика + /api на ядро через nginx. Открывать http://127.0.0.1:3000
  web:
    build: ../web
    image: ai-it-buddy-web:dev
    ports:
      - "127.0.0.1:3000:80"
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 64m
    depends_on: [core]

  # Сбои по логам: loggen пишет access-логи NGINX для VPN и GitLab, incident-radar их считает,
  # ядро раз в 10 секунд спрашивает радар по MCP и само открывает и закрывает инциденты.
  # Включить сбой для демо: curl -XPOST localhost:8092/outages -d '{"service":"vpn","error_rate":0.7}'
  loggen:
    <<: *hardening
    build: ./loggen
    image: ai-it-buddy-loggen:dev
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      LOG_DIR: /logs
      LOGGEN_SERVICES: vpn,gitlab
    volumes:
      - nginx-logs:/logs
    mem_limit: 32m

  incident-radar:
    <<: *hardening
    build: ../incident-radar
    image: incident-radar:dev
    environment:
      INCIDENT_RADAR_MCP_TOKEN: ${RADAR_TOKEN:-dev-radar-token}
    volumes:
      - nginx-logs:/logs:ro
    mem_limit: 128m
    depends_on: [loggen]

  llm-gateway:
    <<: *hardening
    build: ../llm-gateway
    image: llm-gateway:dev
    env_file:
      - path: .env
        required: false   # без .env шлюз поднимется, но модели ответят 401: ключ нужен для чата
    ports:
      - "127.0.0.1:4001:4000"   # на хосте 4001: порт 4000 занят другим проектом
    volumes:
      - ./deploy/${LLM_CONFIG:-llm-gateway.yaml}:/etc/llm-gateway/config.yaml:ro
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # дашборды видны без входа (роль Viewer), только на 127.0.0.1
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 256m
    depends_on: [prometheus]

volumes:
  nginx-logs:
  postgres-data:
  prometheus-data:
  grafana-data:
