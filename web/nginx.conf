# Статика фронта + /api на ядро. Один адрес для браузера: CORS не нужен.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API ядра. Чат отвечает до ~90 с на бесплатной модели
    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location = /readyz { proxy_pass http://core:8080; }
    location = /healthz { access_log off; return 200 "ok\n"; }

    # файлы сборки с хешем в имени - кешируются надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # SPA: любой путь (/chat/access, /requests/ACC-1001) отдает index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
